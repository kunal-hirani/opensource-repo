name: docs

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly Monday 03:00 UTC link/style sweep.
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, spelling, links, style, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python-based checks
        run: pip install codespell interrogate

      - name: Spelling (codespell)
        run: codespell

      - name: Docstring coverage (interrogate, fail-under 80)
        run: interrogate -v .

      - name: Markdown style (markdownlint-cli2)
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      - name: Dead links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress './**/*.md'
          fail: true

      - name: Prose style (Vale)
        uses: vale-cli/vale-action@v3
        # Advisory at first: styles are vendored in styles/Vale/. To make
        # warnings block merges, uncomment:
        # with:
        #   fail_level: warning

  build:
    name: Build the docs site
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and docs toolchain
        # The package is installed editable so mkdocstrings can import it.
        run: |
          pip install -e .
          pip install -r requirements-docs.txt

      - name: Build site with --strict (warnings fail the build)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
