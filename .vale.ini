# Vale prose linter configuration.
# Docs: https://vale.sh/docs
#
# This setup vendors a tiny house style in styles/Vale/ so `vale` passes
# offline with no package download. If you prefer the official packages
# (e.g. write-good), add `Packages = write-good` below and run `vale sync`.

StylesPath = styles

MinAlertLevel = warning

[*.{md,markdown}]
BasedOnStyles = Vale
